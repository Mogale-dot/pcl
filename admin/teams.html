<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams — Admin</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body.admin { background: var(--bg); min-height: 100dvh; }
    .admin-shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100dvh; }
    @media (max-width: 960px) { .admin-shell { grid-template-columns: 1fr; } }

    .admin-side { background: var(--bg-2); border-right: 1px solid var(--border); padding: 22px 16px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100dvh; overflow-y: auto; }
    @media (max-width: 960px) { .admin-side { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 300; transform: translateX(-100%); transition: transform 0.35s var(--ease); } .admin-side.open { transform: translateX(0); } }
    .side-brand { display: flex; align-items: center; gap: 10px; padding: 6px 6px 0; }
    .side-brand img { height: 38px; }
    .side-brand-tag { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--accent); padding: 3px 6px; border-radius: 4px; background: rgba(0, 224, 123, 0.08); border: 1px solid rgba(0, 224, 123, 0.3); }
    .side-group-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-dim); padding: 0 8px; margin-bottom: 6px; }
    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--text-muted); font-size: 14px; font-weight: 600; text-decoration: none; }
    .side-nav-item:hover { background: rgba(255, 255, 255, 0.04); color: var(--text); }
    .side-nav-item.active { background: rgba(0, 224, 123, 0.10); color: var(--accent); border: 1px solid rgba(0, 224, 123, 0.28); }
    .side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--border); }
    .side-foot-user { display: flex; align-items: center; gap: 10px; }
    .side-foot-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #00a95c); color: #04120b; display: grid; place-items: center; font-weight: 900; font-size: 13px; }
    .side-foot-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .side-foot-role { font-size: 11px; color: var(--text-dim); }

    .admin-main { display: flex; flex-direction: column; min-width: 0; }
    .admin-top { height: 64px; padding-inline: 24px; display: flex; align-items: center; gap: 16px; background: rgba(10, 17, 32, 0.72); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .admin-top-burger { display: none; width: 40px; height: 40px; border-radius: 10px; background: none; border: 1px solid var(--border-strong); color: var(--text); place-items: center; cursor: pointer; }
    @media (max-width: 960px) { .admin-top-burger { display: grid; } }
    .admin-top-title { font-size: 16px; font-weight: 800; color: var(--text); flex: 1; }

    .admin-page { padding: 24px; display: flex; flex-direction: column; gap: 20px; flex: 1; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .panel-title { font-size: 15px; font-weight: 800; color: var(--text); }
    .panel-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }
    @media (max-width: 500px) { .teams-grid { grid-template-columns: 1fr; } }

    .team-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
      position: relative;
    }
    .team-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
    .team-card.open { border-color: var(--accent); }

    .team-photo-banner {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--surface-2);
      overflow: hidden;
      position: relative;
    }
    .team-photo-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .team-photo-banner::after {
      content: '';
      position: absolute;
      inset: auto 0 0 0;
      height: 50%;
      background: linear-gradient(to top, rgba(5, 10, 21, 0.7) 0%, transparent 100%);
      pointer-events: none;
    }
    .team-photo-banner .team-photo-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
      background: repeating-linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.02) 0 10px,
        rgba(255, 255, 255, 0.04) 10px 20px
      );
    }

    .team-header {
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      user-select: none;
    }
    .team-crest {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 900;
      color: var(--accent);
    }
    .team-crest img { width: 100%; height: 100%; object-fit: cover; }
    .team-info { flex: 1; min-width: 0; }
    .team-name { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
    .team-coach { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    .team-stats-mini {
      display: flex;
      gap: 14px;
      padding: 0 18px 18px;
      border-bottom: 1px solid var(--border);
    }
    .team-stat-mini {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
    }
    .team-stat-mini-value {
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .team-stat-mini-value.accent { color: var(--accent); }
    .team-stat-mini-value.gold { color: var(--accent-2); }
    .team-stat-mini-label {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 0.14em;
    }

    /* Action buttons in each card */
    .team-actions {
      display: flex;
      gap: 6px;
      padding: 0 18px 16px;
    }
    .team-actions .btn-sm { flex: 1; text-align: center; }

    .team-expand {
      display: none;
      background: var(--surface);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s var(--ease);
    }
    .team-card.open .team-expand { display: block; max-height: 2000px; }

    .team-expand-head {
      padding: 14px 18px 10px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }

    .team-players-list { padding: 6px 0; }
    .team-player-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
    }
    .team-player-row:last-child { border-bottom: none; }
    .player-num {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(0, 224, 123, 0.08);
      border: 1px solid rgba(0, 224, 123, 0.25);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 900;
      color: var(--accent);
    }
    .player-info { min-width: 0; }
    .player-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-pos { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.08em; margin-top: 2px; }
    .player-stats-mini { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .player-stats-mini span { display: inline-flex; align-items: center; gap: 3px; }
    .player-stats-mini strong { color: var(--text); font-weight: 800; }

    .team-no-players { padding: 20px 18px; text-align: center; font-size: 12px; color: var(--text-dim); }

    .team-expand-foot { padding: 12px 18px; border-top: 1px solid var(--border); text-align: right; }
    .team-expand-foot a { font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; }

    .team-toggle-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--text);
      flex-shrink: 0;
      transition: transform var(--dur) var(--ease);
    }
    .team-card.open .team-toggle-icon { transform: rotate(180deg); }

    .btn-sm { padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; border: 1px solid var(--border-strong); background: transparent; color: var(--text); }
    .btn-sm.primary { background: var(--accent); color: #04120b; border-color: var(--accent); }
    .btn-sm.danger { color: var(--danger); border-color: rgba(255, 77, 94, 0.4); }
    .btn-sm:hover { opacity: 0.9; }

    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (max-width: 620px) { .form-grid { grid-template-columns: 1fr; } }
    .form-grid .full { grid-column: 1 / -1; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-dim); }
    .field input, .field select { padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-strong); color: var(--text); font-size: 14px; outline: none; width: 100%; }

    .upload-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 12px;
      border: 2px dashed var(--border-strong);
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
      min-height: 120px;
      text-align: center;
      gap: 6px;
      position: relative;
    }
    .upload-zone:hover { border-color: var(--accent); background: rgba(0, 224, 123, 0.04); }
    .upload-zone.has-image { padding: 0; border-style: solid; overflow: hidden; }
    .upload-zone svg { color: var(--accent); }
    .upload-zone-title { font-size: 13px; font-weight: 800; color: var(--text); }
    .upload-zone-hint { font-size: 11px; color: var(--text-dim); }
    .upload-zone img { width: 100%; height: 120px; object-fit: cover; display: block; }
    .upload-zone .upload-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .upload-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(0, 224, 123, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-back { position: fixed; inset: 0; background: rgba(5, 10, 21, 0.8); backdrop-filter: blur(8px); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 500; overflow-y: auto; }
    .modal-back.open { display: flex; }
    .modal-panel { width: 100%; max-width: 620px; background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 18px; padding: 22px; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-title { font-size: 16px; font-weight: 800; color: var(--text); }
    .modal-close { width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); color: var(--text); cursor: pointer; border: none; font-size: 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    .empty { padding: 40px 20px; text-align: center; color: var(--text-dim); }
    .side-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 290; }
    @media (max-width: 960px) { .side-overlay.open { display: block; } }
  </style>
</head>
<body class="admin">

  <div class="admin-shell">
    <aside class="admin-side" id="adminSide">
      <div class="side-brand">
        <img src="/assets/images/pcl-logo.jpeg" alt="PCL" />
        <span class="side-brand-tag">Admin</span>
      </div>
      <div>
        <div class="side-group-label">Tournament</div>
        <nav class="side-nav">
          <a href="/admin/index.html" class="side-nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
            Overview
          </a>
        </nav>
      </div>
      <div>
        <div class="side-group-label">Registrations</div>
        <nav class="side-nav">
          <a href="/admin/teams.html" class="side-nav-item active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
            Teams
          </a>
          <a href="/admin/players.html" class="side-nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            Players
          </a>
        </nav>
      </div>
      <div>
        <div class="side-group-label">Matches</div>
        <nav class="side-nav">
          <a href="/admin/fixtures.html" class="side-nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            Fixtures
          </a>
          <a href="/admin/results.html" class="side-nav-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
            Results & Stats
          </a>
        </nav>
      </div>
      
      <div class="side-foot">
        <div class="side-foot-user">
          <div class="side-foot-avatar">AD</div>
          <div>
            <div class="side-foot-name">PCL Admin</div>
            <div class="side-foot-role">Administrator</div>
          </div>
        </div>
      </div>
    </aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="admin-main">
      <div class="admin-top">
        <button class="admin-top-burger" id="sideToggle"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div class="admin-top-title">Teams</div>
      </div>

      <div class="admin-page">
        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="panel-title">All Teams</div>
              <div class="panel-sub">Click a team to view their full squad. Use Edit / Delete to manage.</div>
            </div>
            <button class="btn-sm primary" id="addTeamBtn">+ Add Team</button>
          </div>

          <div class="teams-grid" id="teamsGrid">
            <div class="empty" style="grid-column: 1/-1">Loading teams...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-back" id="modalBack">
    <div class="modal-panel">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Add Team</div>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancel</button>
        <button class="btn-sm primary" id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { CONFIG } from '/js/config.js';
    const API = CONFIG.API_BASE_URL;

    const CLOUDINARY_CLOUD_NAME = 'deoqxjsaz';
    const CLOUDINARY_UPLOAD_PRESET = 'salon_uploads';

    function getToken() {
      const t = localStorage.getItem('pcl_token');
      return (t && t !== 'null' && t !== 'undefined') ? t : null;
    }

    document.getElementById('sideToggle').addEventListener('click', () => {
      document.getElementById('adminSide').classList.add('open');
      document.getElementById('sideOverlay').classList.add('open');
    });
    document.getElementById('sideOverlay').addEventListener('click', () => {
      document.getElementById('adminSide').classList.remove('open');
      document.getElementById('sideOverlay').classList.remove('open');
    });

    /* =========================================================
       STATE
       ========================================================= */
    let TEAMS = [];
    let EDITING_TEAM = null;      // null = creating, else = editing
    let LOGO_URL = null;
    let PHOTO_URL = null;
    let UPLOADING_LOGO = false;
    let UPLOADING_PHOTO = false;

    /* =========================================================
       LOAD
       ========================================================= */
    async function loadTeams() {
      const token = getToken();
      try {
        const res = await fetch(`${API}/teams`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const json = await res.json();
        if (res.ok && json.success) {
          TEAMS = json.data;
          renderTeams();
        }
      } catch (err) {
        console.error(err);
        document.getElementById('teamsGrid').innerHTML = `<div class="empty" style="grid-column:1/-1">Failed to load teams</div>`;
      }
    }

    /* =========================================================
       RENDER
       ========================================================= */
    function renderTeams() {
      const grid = document.getElementById('teamsGrid');

      if (!TEAMS.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No teams yet. Click "+ Add Team" to start.</div>`;
        return;
      }

      grid.innerHTML = TEAMS.map(t => `
        <div class="team-card" data-team-id="${t.id}">
          ${t.team_photo_url ? `
            <div class="team-photo-banner">
              <img src="${t.team_photo_url}" alt="${t.name} team photo" onerror="this.parentNode.innerHTML='<div class=&quot;team-photo-fallback&quot;>${t.name}</div>'">
            </div>
          ` : `
            <div class="team-photo-banner">
              <div class="team-photo-fallback">${t.name}</div>
            </div>
          `}

          <div class="team-header" data-toggle="${t.id}">
            <div class="team-crest">
              ${t.logo_url ? `<img src="${t.logo_url}" alt="" onerror="this.remove()">` : initials(t.name)}
            </div>
            <div class="team-info">
              <div class="team-name">${t.name}</div>
              <div class="team-coach">Coach: ${t.coach_name || '—'}</div>
            </div>
            <div class="team-toggle-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </div>
          </div>

          <div class="team-stats-mini">
            <div class="team-stat-mini">
              <div class="team-stat-mini-value">${t.games_played}</div>
              <div class="team-stat-mini-label">Played</div>
            </div>
            <div class="team-stat-mini">
              <div class="team-stat-mini-value accent">${t.goals_scored}</div>
              <div class="team-stat-mini-label">Scored</div>
            </div>
            <div class="team-stat-mini">
              <div class="team-stat-mini-value">${t.goals_conceded}</div>
              <div class="team-stat-mini-label">Conceded</div>
            </div>
            <div class="team-stat-mini">
              <div class="team-stat-mini-value gold">${t.players?.length || 0}</div>
              <div class="team-stat-mini-label">Squad</div>
            </div>
          </div>

          <div class="team-actions">
            <button class="btn-sm" data-edit="${t.id}">Edit</button>
            <button class="btn-sm danger" data-delete="${t.id}">Delete</button>
          </div>

          <div class="team-expand">
            <div class="team-expand-head">Squad</div>
            ${(t.players && t.players.length) ? `
              <div class="team-players-list">
                ${t.players.map(p => `
                  <div class="team-player-row">
                    <div class="player-num">${p.shirt_number || '—'}</div>
                    <div class="player-info">
                      <div class="player-name">${p.full_name}</div>
                      <div class="player-pos">${p.position || '—'}</div>
                    </div>
                    <div class="player-stats-mini">
                      <span>⚽ <strong>${p.goals}</strong></span>
                      <span>🅰 <strong>${p.assists}</strong></span>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : `
              <div class="team-no-players">No players registered yet.</div>
            `}
            <div class="team-expand-foot">
              <a href="/admin/players.html">Manage players →</a>
            </div>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('[data-toggle]').forEach(el => {
        el.addEventListener('click', (e) => {
          // Prevent toggle if clicking edit/delete (they're outside the header, but safe guard)
          if (e.target.closest('[data-edit]') || e.target.closest('[data-delete]')) return;
          el.closest('.team-card').classList.toggle('open');
        });
      });

      grid.querySelectorAll('[data-edit]').forEach(btn =>
        btn.addEventListener('click', () => openEditTeam(btn.dataset.edit)));

      grid.querySelectorAll('[data-delete]').forEach(btn =>
        btn.addEventListener('click', () => deleteTeam(btn.dataset.delete)));
    }

    /* =========================================================
       ADD TEAM
       ========================================================= */
    document.getElementById('addTeamBtn').addEventListener('click', () => {
      EDITING_TEAM = null;
      LOGO_URL = null;
      PHOTO_URL = null;
      UPLOADING_LOGO = false;
      UPLOADING_PHOTO = false;

      openTeamModal({
        title: 'Add Team',
        name: '',
        coach: '',
        logo: null,
        photo: null,
      });
    });

    /* =========================================================
       EDIT TEAM
       ========================================================= */
    function openEditTeam(id) {
      const team = TEAMS.find(t => t.id === id);
      if (!team) return;

      EDITING_TEAM = team;
      LOGO_URL = team.logo_url || null;
      PHOTO_URL = team.team_photo_url || null;
      UPLOADING_LOGO = false;
      UPLOADING_PHOTO = false;

      openTeamModal({
        title: `Edit: ${team.name}`,
        name: team.name,
        coach: team.coach_name || '',
        logo: team.logo_url,
        photo: team.team_photo_url,
      });
    }

    /* =========================================================
       SHARED MODAL BUILDER
       ========================================================= */
    function openTeamModal({ title, name, coach, logo, photo }) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = `
        <div class="form-grid">
          <div class="field full">
            <label>Team Name</label>
            <input id="tName" type="text" value="${name}" placeholder="e.g. Polokwane FC">
          </div>
          <div class="field full">
            <label>Coach Name (Optional)</label>
            <input id="tCoach" type="text" value="${coach}" placeholder="e.g. John Smith">
          </div>

          <div class="field full">
            <label>Team Logo</label>
            <div class="upload-zone ${logo ? 'has-image' : ''}" id="logoZone">
              ${logo ? `
                <img src="${logo}" alt="">
                <div class="upload-overlay">Logo · click to change</div>
              ` : `
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>
                </svg>
                <div class="upload-zone-title">Upload Logo</div>
                <div class="upload-zone-hint">PNG, JPG · Square recommended</div>
              `}
            </div>
            <input type="file" id="logoFile" accept="image/*" hidden>
          </div>

          <div class="field full">
            <label>Team Photo (Optional)</label>
            <div class="upload-zone ${photo ? 'has-image' : ''}" id="photoZone">
              ${photo ? `
                <img src="${photo}" alt="">
                <div class="upload-overlay">Photo · click to change</div>
              ` : `
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                  <path d="M21 15l-5-5L5 21"/>
                </svg>
                <div class="upload-zone-title">Upload Team Photo</div>
                <div class="upload-zone-hint">Wide shot · 16:9 recommended</div>
              `}
            </div>
            <input type="file" id="photoFile" accept="image/*" hidden>
          </div>
        </div>
      `;

      // Wire logo upload
      const logoZone = document.getElementById('logoZone');
      const logoFile = document.getElementById('logoFile');
      logoZone.addEventListener('click', () => logoFile.click());
      logoFile.addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        showUploading(logoZone, 'Uploading logo...');
        UPLOADING_LOGO = true;
        try {
          LOGO_URL = await uploadToCloudinary(file, 'pcl/teams/logos');
          showUploaded(logoZone, LOGO_URL, 'Logo uploaded · click to change');
        } catch {
          showFailed(logoZone, 'Failed to upload logo');
          LOGO_URL = logo || null;
        } finally {
          UPLOADING_LOGO = false;
        }
      });

      // Wire photo upload
      const photoZone = document.getElementById('photoZone');
      const photoFile = document.getElementById('photoFile');
      photoZone.addEventListener('click', () => photoFile.click());
      photoFile.addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        showUploading(photoZone, 'Uploading photo...');
        UPLOADING_PHOTO = true;
        try {
          PHOTO_URL = await uploadToCloudinary(file, 'pcl/teams/photos');
          showUploaded(photoZone, PHOTO_URL, 'Photo uploaded · click to change');
        } catch {
          showFailed(photoZone, 'Failed to upload photo');
          PHOTO_URL = photo || null;
        } finally {
          UPLOADING_PHOTO = false;
        }
      });

      document.getElementById('modalBack').classList.add('open');
    }

    /* =========================================================
       UPLOAD HELPERS
       ========================================================= */
    async function uploadToCloudinary(file, folder) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('folder', folder);

      const res = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
        { method: 'POST', body: formData }
      );
      const json = await res.json();
      if (!json.secure_url) throw new Error(json.error?.message || 'Upload failed');
      return json.secure_url;
    }

    function showUploading(zone, text) {
      zone.classList.add('has-image');
      zone.innerHTML = `<div class="upload-spinner"></div><div class="upload-zone-hint">${text}</div>`;
    }
    function showUploaded(zone, url, overlay) {
      zone.innerHTML = `<img src="${url}" alt=""><div class="upload-overlay">${overlay}</div>`;
    }
    function showFailed(zone, text) {
      zone.classList.remove('has-image');
      zone.innerHTML = `<div class="upload-zone-hint" style="color:var(--danger)">${text}</div>`;
    }

    /* =========================================================
       SAVE (Create OR Update)
       ========================================================= */
    document.getElementById('modalSave').addEventListener('click', async () => {
      if (UPLOADING_LOGO || UPLOADING_PHOTO) {
        return alert('Please wait for uploads to finish.');
      }

      const name = document.getElementById('tName').value.trim();
      const coach_name = document.getElementById('tCoach').value.trim();

      if (!name) return alert('Team name is required');
      if (!LOGO_URL) return alert('Please upload a team logo');

      const token = getToken();
      const isEdit = !!EDITING_TEAM;
      const url = isEdit ? `${API}/teams/${EDITING_TEAM.id}` : `${API}/teams`;
      const method = isEdit ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({
            name,
            coach_name,
            logo_url: LOGO_URL,
            team_photo_url: PHOTO_URL,
          })
        });
        const json = await res.json();
        if (res.ok && json.success) {
          closeModal();
          loadTeams();
        } else {
          alert(json.message || 'Failed to save team');
        }
      } catch (err) {
        alert('Network error');
      }
    });

    /* =========================================================
       DELETE TEAM
       ========================================================= */
    async function deleteTeam(id) {
      const team = TEAMS.find(t => t.id === id);
      if (!team) return;

      const confirmed = confirm(
        `Delete "${team.name}"?\n\nThis will also remove:\n` +
        `• All players on this team\n` +
        `• All fixtures involving this team\n` +
        `• All tournament registrations\n\n` +
        `This cannot be undone.`
      );
      if (!confirmed) return;

      const token = getToken();
      try {
        const res = await fetch(`${API}/teams/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const json = await res.json();
        if (res.ok && json.success) {
          loadTeams();
        } else {
          alert(json.message || 'Failed to delete team');
        }
      } catch (err) {
        alert('Network error');
      }
    }

    /* =========================================================
       MODAL HELPERS
       ========================================================= */
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalBack').addEventListener('click', e => {
      if (e.target === document.getElementById('modalBack')) closeModal();
    });
    function closeModal() {
      document.getElementById('modalBack').classList.remove('open');
      EDITING_TEAM = null;
      LOGO_URL = null;
      PHOTO_URL = null;
    }

    function initials(name) {
      return name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    }

    loadTeams();
  </script>

</body>
</html>
