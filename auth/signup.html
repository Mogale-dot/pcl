<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050a15" />
  <title>Create account — PCL</title>
  <link rel="stylesheet" href="/css/main.css" />

  <style>
    .auth-page {
      min-height: calc(100dvh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(0, 224, 123, 0.08), transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 120, 255, 0.06), transparent 50%),
        var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    @media (max-width: 480px) {
      .auth-card { padding: 28px 22px 24px; border-radius: 16px; }
    }

    .auth-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }
    .auth-logo img { height: 52px; }

    .auth-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text);
      text-align: center;
      margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.55;
      margin-bottom: 26px;
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #fff;
      color: #1f1f1f;
      border: 1px solid #dadce0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .btn-google:hover { background: #f5f5f5; border-color: #c4c7cc; }
    .btn-google:active { transform: scale(0.99); }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .auth-field label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .auth-field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .auth-field input:focus {
      border-color: var(--accent);
      background: rgba(0, 224, 123, 0.03);
    }

    .auth-password-wrap { position: relative; }
    .auth-password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border: none;
    }
    .auth-password-toggle:hover { color: var(--text); }

    .auth-terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-top: 4px;
    }
    .auth-terms input { margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; }
    .auth-terms a { color: var(--accent); font-weight: 700; }

    .auth-submit {
      margin-top: 6px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 999px;
      background: var(--accent);
      color: #04120b;
      font-size: 15px;
      font-weight: 900;
      border: none;
      cursor: pointer;
      transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .auth-submit:hover { background: #14f58c; }
    .auth-submit:active { transform: scale(0.98); }
    .auth-submit:disabled {
      background: var(--surface-2);
      color: var(--text-dim);
      cursor: not-allowed;
    }

    .auth-error {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 77, 94, 0.08);
      border: 1px solid rgba(255, 77, 94, 0.35);
      color: #ff8a95;
      font-size: 13px;
      font-weight: 600;
      display: none;
      margin-bottom: 16px;
    }
    .auth-error.show { display: block; }

    .auth-foot {
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
    }
    .auth-foot a {
      color: var(--accent);
      font-weight: 800;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a href="/index.html" class="nav-logo" aria-label="PCL Home">
        <img src="/assets/images/pcl-logo.jpeg" alt="PCL" />
      </a>
      <div class="nav-actions">
        <a href="/auth/login.html" class="nav-login">
          <span>Login</span>
        </a>
      </div>
    </div>
    <div class="nav-divider"></div>
  </header>


  <!-- AUTH PAGE -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="/assets/images/pcl-logo.jpeg" alt="PCL" />
      </div>

      <h1 class="auth-title">Create your account</h1>
      <p class="auth-sub">Join PCL as a member. Free, and takes less than a minute.</p>

      <div class="auth-error" id="errorBox"></div>

      <!-- Google -->
      <button type="button" class="btn-google" id="googleBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77a6.64 6.64 0 0 1-9.9-3.48H2.24v2.84A11 11 0 0 0 12 23z"/>
          <path fill="#FBBC05" d="M5.81 14.09a6.6 6.6 0 0 1 0-4.18V7.07H2.24a11 11 0 0 0 0 9.86l3.57-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.24 7.07l3.57 2.84A6.6 6.6 0 0 1 12 5.38z"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-divider">or</div>

      <!-- Form -->
      <form class="auth-form" id="signupForm" novalidate>
        <div class="auth-field">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" required autocomplete="name"
                 placeholder="e.g. Thabo Mokoena" />
        </div>

        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email"
                 placeholder="you@example.com" />
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <div class="auth-password-wrap">
            <input type="password" id="password" required minlength="6"
                   autocomplete="new-password" placeholder="At least 6 characters" />
            <button type="button" class="auth-password-toggle" data-toggle="password" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                   stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" required
                 autocomplete="new-password" placeholder="Repeat password" />
        </div>

        <label class="auth-terms">
          <input type="checkbox" id="terms" required />
          <span>
            I agree to the <a href="#">Terms of Use</a> and
            <a href="#">Privacy Policy</a>.
          </span>
        </label>

        <button type="submit" class="auth-submit" id="submitBtn">
          Create account
        </button>
      </form>

      <div class="auth-foot">
        Already have an account?
        <a href="/auth/login.html">Sign in</a>
      </div>
    </div>
  </main>


  <script type="module">
    import { CONFIG } from '/js/config.js';

    const API = CONFIG.API_BASE_URL;

    /* Already logged in? Redirect */
    if (localStorage.getItem('pcl_token')) {
      const role = localStorage.getItem('pcl_role');
      window.location.href = role === 'admin'
        ? '/admin/index.html'
        : '/public/membership.html';
    }

    const form      = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox  = document.getElementById('errorBox');

    /* password toggle */
    document.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.toggle);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('show');
    }
    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('show');
    }

    /* Google button — placeholder */
    document.getElementById('googleBtn').addEventListener('click', () => {
      showError('Google sign-up is coming soon. Please use email for now.');
      /* TODO: window.location.href = `${API}/auth/google`; */
    });

    /* submit */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const full_name = document.getElementById('full_name').value.trim();
      const email     = document.getElementById('email').value.trim();
      const password  = document.getElementById('password').value;
      const confirm   = document.getElementById('confirm').value;
      const terms     = document.getElementById('terms').checked;

      if (!full_name || !email || !password) {
        return showError('Please fill in all fields.');
      }
      if (password.length < 6) {
        return showError('Password must be at least 6 characters.');
      }
      if (password !== confirm) {
        return showError('Passwords do not match.');
      }
      if (!terms) {
        return showError('Please accept the terms to continue.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';

      try {
        const res = await fetch(`${API}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name,
            email,
            password,
            role: 'member',   // always member on signup
          }),
        });

        const json = await res.json();

        if (!res.ok || !json.success) {
          throw new Error(json.message || 'Signup failed');
        }

        const { user, accessToken, refreshToken } = json.data;

        localStorage.setItem('pcl_token',   accessToken);
        localStorage.setItem('pcl_refresh', refreshToken);
        localStorage.setItem('pcl_user',    JSON.stringify(user));
        localStorage.setItem('pcl_role',    user.role);

        submitBtn.textContent = 'Account created ✓';
        setTimeout(() => {
          window.location.href = '/public/membership.html';
        }, 500);

      } catch (err) {
        showError(err.message || 'Something went wrong. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>

</body>
</html>
